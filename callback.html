<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connected – Coachjames.channel</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fafafa;color:#1a1a1a;line-height:1.6}
  main{max-width:720px;margin:0 auto;padding:56px 20px}
  h1{font-size:1.6rem;margin:0 0 8px}
  p{color:#444}
  textarea{width:100%;box-sizing:border-box;height:120px;font:14px ui-monospace,Menlo,monospace;padding:12px;border:1px solid #ccc;border-radius:8px;background:#fff}
  button{margin-top:12px;background:#fe2c55;color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:1rem;font-weight:600;cursor:pointer}
  .err{color:#c62828}
  a{color:#fe2c55}
</style>
</head>
<body>
<main>
  <h1 id="title">TikTok connected</h1>
  <p id="msg">Copy the link below and paste it back into Coachjames.channel to finish connecting your TikTok account.<br>
     คัดลอกลิงก์ด้านล่าง แล้ววางกลับไปที่ Claude เพื่อเชื่อมบัญชีให้เสร็จ</p>
  <textarea id="link" readonly></textarea>
  <button id="copy">Copy / คัดลอก</button>
  <p><a href="index.html">← Coachjames.channel</a></p>
</main>
<script>
  var q = new URLSearchParams(location.search);
  var box = document.getElementById('link');
  box.value = location.href;
  if (q.get('error')) {
    document.getElementById('title').textContent = 'Not connected';
    var m = document.getElementById('msg');
    m.className = 'err';
    m.textContent = 'TikTok returned: ' + q.get('error') + ' ' + (q.get('error_description') || '');
  } else if (!q.get('code')) {
    document.getElementById('title').textContent = 'Coachjames.channel';
    document.getElementById('msg').textContent = 'This page receives the TikTok sign-in result. Nothing to do here.';
  }
  document.getElementById('copy').onclick = function () {
    box.select();
    try { navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand('copy'); }
    this.textContent = 'Copied / คัดลอกแล้ว';
  };
</script>
</body>
</html>
